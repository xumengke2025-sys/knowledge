name: Apply expert depth v0.5.1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-expert-depth-v051.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Apply depth migration
        run: node scripts/apply-expert-depth-v051.mjs
      - name: Run all quality gates
        run: |
          python scripts/validate.py
          python scripts/validate-upgrade.py
          python scripts/validate-academic.py
          python scripts/validate-v05.py
          python scripts/validate-depth.py
      - name: Commit generated depth state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add industries firmbuddy/import-bundle.json coverage-v0.5.json QUALITY-V0.5.md
          git diff --cached --quiet && exit 0
          git commit -m "feat: deepen industry maturity and finance assessment models"
          git push origin HEAD:main
