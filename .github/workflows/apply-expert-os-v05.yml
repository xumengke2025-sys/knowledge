name: Apply expert OS v0.5
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-expert-os-v05.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Apply v0.5 migration
        run: node scripts/apply-expert-os-v05.mjs
      - name: Run all knowledge gates
        run: |
          python scripts/validate.py
          python scripts/validate-upgrade.py
          python scripts/validate-academic.py
          python scripts/validate-v05.py
      - name: Commit generated v0.5 state
        run: |
          rm -f .github/workflows/apply-expert-os-v05.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: wire v0.5 benchmarks playbooks and runtime company tools"
          git push origin HEAD:main
