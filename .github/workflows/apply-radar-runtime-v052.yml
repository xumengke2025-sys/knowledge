name: Apply radar runtime v0.5.2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-radar-runtime-v052.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Apply radar expert migration
        run: node scripts/apply-radar-runtime-v052.mjs
      - name: Run quality gates
        run: |
          python scripts/validate.py
          python scripts/validate-upgrade.py
          python scripts/validate-academic.py
          python scripts/validate-v05.py
          python scripts/validate-depth.py
          python scripts/validate-radar.py
          python scripts/validate-radar-runtime.py
      - name: Commit generated radar state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add industries firmbuddy/import-bundle.json firmbuddy/expert-payloads.json firmbuddy/expert-index.json coverage-v0.5.json QUALITY-V0.5.md
          git diff --cached --quiet && exit 0
          git commit -m "feat: wire industry radar into expert runtime"
          git pull --rebase origin main
          git push origin HEAD:main
