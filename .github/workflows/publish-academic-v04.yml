name: Publish academic knowledge v0.4
on:
  push:
    branches: [main]
    paths:
      - 'scripts/academic-v04-generator.py'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore academic overlay
        run: python scripts/academic-v04-generator.py
      - name: Apply academic equipment patch
        run: python scripts/apply-academic-v04.py
      - name: Validate base repository
        run: python scripts/validate.py
      - name: Validate v0.3 evidence and import bundle
        run: python scripts/validate-upgrade.py
      - name: Validate v0.4 academic layer
        run: python scripts/validate-academic.py
      - name: Commit published snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/academic-v04-generator.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: add expert-equippable academic knowledge layer v0.4"
          git push origin HEAD:main
