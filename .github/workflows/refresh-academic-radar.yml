name: Refresh academic radar
on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-academic-radar.py'
      - 'industries/**/radar-sources.json'
      - '.github/workflows/refresh-academic-radar.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Discover recent academic candidates
        run: python scripts/refresh-academic-radar.py --days 240 --limit-per-query 8
      - name: Persist candidate inbox
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add industries/*/radar radar/academic-refresh-summary.json firmbuddy/technology-intelligence/data/radar.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh academic radar candidates"
          git pull --rebase origin main
          git push origin HEAD:main

