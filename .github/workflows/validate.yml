name: Validate knowledge base
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run repository quality gates
        run: python scripts/validate.py
      - name: Validate seven-industry evidence and import bundle
        run: python scripts/validate-upgrade.py
      - name: Validate v0.4 academic knowledge equipment
        run: python scripts/validate-academic.py

      - name: Validate v0.5 expert operating system
        run: python scripts/validate-v05.py
