name: Validate knowledge base
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run repository quality gates
        run: python scripts/validate.py
      - name: Validate seven-industry evidence and import bundle
        run: python scripts/validate-upgrade.py
      - name: Validate v0.4 academic knowledge equipment
        run: python scripts/validate-academic.py

      - name: Validate v0.7 SecEmp arXiv source contracts
        run: python scripts/validate-secemp-arxiv.py

      - name: Validate committed SecEmp candidate and paper_text outputs
        run: python scripts/validate-secemp-outputs.py

      - name: Validate SecEmp academic promotion v0.8
        run: python scripts/validate-secemp-academic-v08.py

      - name: Validate SecEmp section review v0.9
        run: python scripts/validate-secemp-academic-v09.py

      - name: Validate v0.5 expert operating system
        run: python scripts/validate-v05.py

      - name: Validate v0.5.1 industry maturity and finance depth
        run: python scripts/validate-depth.py

      - name: Validate academic radar candidate quality
        run: python scripts/validate-radar.py

      - name: Validate v0.5.2 radar runtime contract
        run: python scripts/validate-radar-runtime.py
